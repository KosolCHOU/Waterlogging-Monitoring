services:
  web:
    build: .
    ports:
      - "8001:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgres://postgres:postgres@db:5432/cropxcel
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=127.0.0.1,localhost,web,testserver,0.0.0.0,*
      - SECRET_KEY=dev-only-secret-change-me
      - WEB_CONCURRENCY=1
      - USE_DEMO_MODE=true
    depends_on:
      - db
      - redis
    volumes:
      - ./media:/app/media

  db:
    image: postgres:13
    environment:
      - POSTGRES_DB=cropxcel
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    build: .
    command: celery -A cropxcel_project worker --loglevel=info
    environment:
      - DEBUG=False
      - DATABASE_URL=postgres://postgres:postgres@db:5432/cropxcel
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=127.0.0.1,localhost,web
      - SECRET_KEY=dev-only-secret-change-me
      - DISABLE_EARTH_ENGINE=true
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
